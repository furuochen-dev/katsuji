<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Katsuji</title>
    <link rel="stylesheet" href="katsuji.css" />
    <style>
      body {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        line-height: 1.75;
        max-width: 40em;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 600;
      }
      .note {
        font-size: 0.9rem;
        color: #555;
      }
      #article {
        max-width: 28em;
        background: #fff;
        border: 1px solid #e3ddd0;
        border-radius: 10px;
        padding: 1.25rem 1.35rem;
        margin: 1.5rem 0;
      }
      #article p {
        margin: 0 0 1em;
      }
      #article p:last-child {
        margin-bottom: 0;
      }
      code {
        font-size: 0.88em;
      }
    </style>
  </head>
  <body>
    <h1>Katsuji</h1>
    <p class="note">
      中文标点外侧空隙与避头避尾。本页由 GitHub Pages 托管；脚本文件：
      <a href="katsuji.js"><code>katsuji.js</code></a>、
      <a href="katsuji.css"><code>katsuji.css</code></a>。
      仓库 <a href="https://github.com/furuochen-dev/katsuji">furuochen-dev/katsuji</a>。
    </p>

    <article id="article">
      <p>他说，《红楼梦》是一部奇书，而「脂砚斋」批语更让读者着迷：你怎么看？</p>
      <p>水果摊上有苹果、香蕉、橘子，价格不贵，味道也好……</p>
    </article>

    <script src="katsuji.js"></script>
    <script>
      var root = document.getElementById('article');
      Katsuji.apply(root);
      Katsuji.applyHangAvoidance(root);
    </script>
  </body>
</html>
